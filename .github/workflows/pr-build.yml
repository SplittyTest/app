name: PR Build

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API Install & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: api/package.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          if npm run | grep -q "lint"; then npm run lint; else echo "No lint script"; fi

      - name: Build
        run: npm run build

  ui:
    name: UI Install & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ui/package.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/containers/Dockerfile
          push: false
          tags: splittytest:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint --strict ops/charts/splittytest --set secrets.authSecret=ci --set secrets.sessionSecret=ci

      - name: Render chart
        run: helm template ci ops/charts/splittytest --set secrets.authSecret=ci --set secrets.sessionSecret=ci > /dev/null

  summary:
    name: Summary
    needs: [api, ui, docker, helm]
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: echo "API, UI, Docker image and Helm chart checks completed successfully." 
