name: PR Build

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API Install & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: api/package.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          if npm run | grep -q "lint"; then npm run lint; else echo "No lint script"; fi

      - name: Build
        run: npm run build

  ui:
    name: UI Install & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ui/package.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  summary:
    name: Summary
    needs: [api, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: echo "API and UI builds completed successfully." 
