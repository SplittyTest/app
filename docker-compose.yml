# SplittyTest full stack: API+UI, Postgres (store), ClickHouse (OLAP), Redis (dict/sessions).
#
#   cp .env.example .env            # then edit the secrets
#   docker compose up --build       # migrations run first, then the API starts on :3000
#
# NODE_ENV defaults to "local" so the UI login works over plain http. Set NODE_ENV=production
# only behind TLS: production mode marks session cookies "secure" and restricts CORS.

name: splittytest

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-local}
  PORT: 3000
  APP_URL: ${APP_URL:-http://localhost:3000}
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
  STORE_TYPE: postgres
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DATABASE: splittytest
  OLAP_TYPE: clickhouse
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USERNAME: default
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
  CLICKHOUSE_DATABASE: splittytest
  DICT_TYPE: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
  MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
  # Seed admin user for the first store migration, as JSON (see api/migrate/store/001-first-user.ts).
  INIT_USER: ${INIT_USER:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: splittytest
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d splittytest"]
      interval: 5s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: splittytest
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 24

  redis:
    # Redis 8 bundles the JSON module the API uses (json.set / json.get).
    image: redis:8-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: ops/containers/Dockerfile
    image: splittytest:${IMAGE_TAG:-latest}
    command: ["migrate"]
    environment: *app-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: ops/containers/Dockerfile
    image: splittytest:${IMAGE_TAG:-latest}
    environment: *app-env
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - uploads:/app/public/uploads
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  clickhouse-data:
  redis-data:
  uploads:
