# Default values for splittytest.
#
# The chart deploys the SplittyTest image (API + UI in one container) and runs the
# database migrations as a Helm hook Job. Postgres, ClickHouse and Redis are NOT
# deployed by this chart; point `config` at existing services.

replicaCount: 1

image:
  # Image built from ops/containers/Dockerfile and pushed to your registry.
  repository: splittytest
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Non-secret application configuration. Rendered into a ConfigMap as environment
# variables (see api/config/custom-environment-variables.json for the mapping).
config:
  # "production" marks session cookies Secure and enforces per-API-key CORS whitelists,
  # so the app must be served over TLS. Use any other value (e.g. "staging") for plain http.
  nodeEnv: production
  # Public URL of the app; used for links in emails (password resets).
  appUrl: https://splittytest.example.com
  store:
    # postgres | sqlite
    type: postgres
    postgres:
      host: postgres-headless.postgres.svc.cluster.local
      port: 5432
      user: postgres
      database: splittytest
  olap:
    # clickhouse | duckdb
    type: clickhouse
    clickhouse:
      url: http://clickhouse-clickhouse.clickhouse.svc.cluster.local:8123
      username: default
      database: splittytest
  redis:
    host: redis.redis.svc.cluster.local
    port: 6379
    username: ""
  # Extra environment variables added verbatim to the app and migration containers.
  extraEnv: []
  # - name: API_SESSION_MAX_AGE
  #   value: "3600000"

# Secret values. Either supply them here (rendered into a chart-managed Secret) or set
# existingSecret to the name of a Secret you manage that contains these keys:
#   AUTH_SECRET, SESSION_SECRET, POSTGRES_PASSWORD, CLICKHOUSE_PASSWORD,
#   REDIS_PASSWORD, MAILGUN_API_KEY, MAILGUN_DOMAIN, INIT_USER  (all optional but AUTH/SESSION/DB passwords)
secrets:
  existingSecret: ""
  authSecret: ""
  sessionSecret: ""
  postgresPassword: ""
  clickhousePassword: ""
  redisPassword: ""
  mailgunApiKey: ""
  mailgunDomain: ""
  # JSON overriding the seeded admin user, e.g. '{"email":"me@example.com","password":"..."}'
  initUser: ""

# Database migrations run as a Helm hook Job using the same image (`migrate` entrypoint).
# post-install: on first install the ConfigMap/Secret must exist before the job can run.
# pre-upgrade: on upgrades the schema is migrated before the new pods roll out.
migrations:
  enabled: true
  hooks: post-install,pre-upgrade
  hookWeight: "0"
  backoffLimit: 3
  activeDeadlineSeconds: 900
  resources: {}

# Uploaded images are stored on the local filesystem at /app/public/uploads.
# Enable a PVC to persist them (use a ReadWriteMany class when replicaCount > 1).
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 5Gi

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: "traefik"
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: splittytest.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: splittytest-tls
  #    hosts:
  #      - splittytest.example.com

# Alternative to Ingress: Gateway API HTTPRoute.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - splittytest.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

resources: {}
  # limits:
  #   cpu: 1000m
  #   memory: 1Gi
  # requests:
  #   cpu: 200m
  #   memory: 512Mi

# /healthz pings Redis and returns 503 if it is unreachable.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes / volumeMounts on the app Deployment.
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
