# Default values for the Splitty Test chart.
#
# Quick start (everything in-cluster):
#   helm install splittytest ./ops/charts/splittytest \
#     --set image.repository=<registry>/splittytest \
#     --set migrator.image.repository=<registry>/splittytest-migrator
#
# Build the two images from the repository root:
#   docker build -f ops/containers/Dockerfile          -t <registry>/splittytest:<tag> .
#   docker build -f ops/containers/Dockerfile.migrator -t <registry>/splittytest-migrator:<tag> .

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Application (API + built UI)
# -----------------------------------------------------------------------------

image:
  # Built from ops/containers/Dockerfile
  repository: splittytest/splittytest
  # Defaults to the chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

app:
  # Port the Node server listens on inside the container (config api.port)
  port: 3000

  # Public URL of the app, used in links in emails (config app.url).
  # Defaults to the first ingress/HTTPRoute host, otherwise http://localhost:3000.
  url: ""

  # "production" turns on secure-only session cookies and restricts CORS to each
  # API key's domain whitelist. It requires HTTPS in front of the app (e.g. an
  # Ingress with TLS). Set to "" to test over plain HTTP (e.g. kubectl port-forward).
  nodeEnv: production

  # Lifetime of sessions created with an API key, in milliseconds (default 1 hour)
  apiSessionMaxAge: ""

  uploads:
    mimeTypes:
      - image/jpeg
      - image/png
      - image/gif
    # Uploaded images are written to /app/ui/dist/uploads and served at /uploads.
    # Without persistence they are lost when the pod restarts.
    persistence:
      enabled: true
      # Use ReadWriteMany if you run more than one replica (or enable autoscaling)
      accessMode: ReadWriteOnce
      size: 5Gi
      storageClass: ""
      # Use an existing PVC instead of creating one
      existingClaim: ""

  # Extra node-config settings merged into NODE_CONFIG (see api/config/default.js), e.g.
  #   nodeConfig:
  #     log: { level: info }
  #     email: { from: "Acme Tests <no-reply@acme.com>" }
  nodeConfig: {}

  # Extra environment variables for the app and migration containers
  extraEnv: []

# Secrets. Leave a value empty to have one generated on install (and kept on upgrade).
secrets:
  # Use an existing Secret instead of creating one. It must contain the keys:
  #   AUTH_SECRET, SESSION_SECRET, POSTGRES_PASSWORD, CLICKHOUSE_PASSWORD,
  #   MAILGUN_API_KEY, MAILGUN_DOMAIN (use any placeholder if you don't send email)
  # and optionally REDIS_PASSWORD.
  existingSecret: ""
  authSecret: ""
  sessionSecret: ""

mailgun:
  apiKey: ""
  domain: ""

# -----------------------------------------------------------------------------
# Migrations
# -----------------------------------------------------------------------------

migrator:
  # Runs the Postgres and ClickHouse migrations as a Helm hook after every
  # install and upgrade. Migrations that already ran are skipped.
  enabled: true
  image:
    # Built from ops/containers/Dockerfile.migrator
    repository: splittytest/splittytest-migrator
    tag: ""
    pullPolicy: IfNotPresent
  # JSON overrides for the first admin user, used only on an empty database.
  # Default login is admin@splittytest.com with a generated password printed in the
  # migration job's logs (kubectl logs job/<release>-migrate). Set initUser to choose one.
  #   initUser: '{"email":"me@example.com","password":"a-strong-password"}'
  initUser: ""
  backoffLimit: 3
  activeDeadlineSeconds: 900
  resources: {}

# -----------------------------------------------------------------------------
# Postgres (store)
# -----------------------------------------------------------------------------

postgresql:
  # true: run a single-node Postgres in the cluster.
  # false: connect to an external Postgres at `host` (put its password in the
  #        POSTGRES_PASSWORD key, via secrets.existingSecret or `password` below).
  enabled: true
  host: ""
  port: 5432
  username: postgres
  database: splittytest
  # Leave empty to generate one
  password: ""
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  persistence:
    size: 8Gi
    storageClass: ""
  resources: {}

# -----------------------------------------------------------------------------
# Redis (sessions, cache, buffers). Needs the RedisJSON module (Redis Stack,
# Redis 8+, or Valkey with valkey-json).
# -----------------------------------------------------------------------------

redis:
  enabled: true
  host: ""
  port: 6379
  username: ""
  # Optional. When set, the in-cluster Redis requires it too.
  password: ""
  image:
    repository: redis/redis-stack-server
    tag: "7.4.0-v8"
    pullPolicy: IfNotPresent
  persistence:
    size: 2Gi
    storageClass: ""
  resources: {}

# -----------------------------------------------------------------------------
# ClickHouse (metrics). Needs 25.3+ for the JSON column type.
# -----------------------------------------------------------------------------

clickhouse:
  enabled: true
  # For an external ClickHouse, the HTTP URL, e.g. https://my-clickhouse:8443
  url: ""
  username: default
  database: splittytest
  # Leave empty to generate one
  password: ""
  image:
    repository: clickhouse/clickhouse-server
    tag: "25.8"
    pullPolicy: IfNotPresent
  persistence:
    size: 20Gi
    storageClass: ""
  resources: {}

# -----------------------------------------------------------------------------
# Kubernetes plumbing
# -----------------------------------------------------------------------------

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: splittytest.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: splittytest-tls
  #    hosts:
  #      - splittytest.example.com

# Gateway API alternative to Ingress
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - splittytest.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 256Mi
  # limits:
  #   memory: 512Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Extra volumes / mounts for the app container
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
