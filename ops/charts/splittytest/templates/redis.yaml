{{- if .Values.redis.enabled }}
{{- $name := printf "%s-redis" (include "splittytest.fullname" .) }}
{{- $component := list . "redis" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "splittytest.componentLabels" $component | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: redis
  selector:
    {{- include "splittytest.componentSelectorLabels" $component | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "splittytest.componentLabels" $component | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "splittytest.componentSelectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "splittytest.componentSelectorLabels" $component | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          env:
            {{- if .Values.redis.password }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "splittytest.secretName" . }}
                  key: REDIS_PASSWORD
            - name: REDISCLI_AUTH
              value: $(REDIS_PASSWORD)
            - name: REDIS_ARGS
              value: "--appendonly yes --requirepass $(REDIS_PASSWORD)"
            {{- else }}
            - name: REDIS_ARGS
              value: "--appendonly yes"
            {{- end }}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 20
          {{- with .Values.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "splittytest.storageClass" .Values.redis.persistence | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
{{- end }}
