{{- if not .Values.secrets.existingSecret }}
{{- $name := include "splittytest.fullname" . }}
{{- $existing := dict }}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $existing = .data | default dict }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "splittytest.labels" . | nindent 4 }}
  annotations:
    # Keep generated secrets (and the database passwords baked into the volumes)
    # if the release is uninstalled and reinstalled.
    helm.sh/resource-policy: keep
type: Opaque
data:
  AUTH_SECRET: {{ include "splittytest.secretValue" (dict "value" .Values.secrets.authSecret "existing" $existing "key" "AUTH_SECRET" "length" 48) }}
  SESSION_SECRET: {{ include "splittytest.secretValue" (dict "value" .Values.secrets.sessionSecret "existing" $existing "key" "SESSION_SECRET" "length" 48) }}
  POSTGRES_PASSWORD: {{ include "splittytest.secretValue" (dict "value" .Values.postgresql.password "existing" $existing "key" "POSTGRES_PASSWORD" "length" 32) }}
  CLICKHOUSE_PASSWORD: {{ include "splittytest.secretValue" (dict "value" .Values.clickhouse.password "existing" $existing "key" "CLICKHOUSE_PASSWORD" "length" 32) }}
  {{- with .Values.redis.password }}
  REDIS_PASSWORD: {{ . | toString | b64enc }}
  {{- end }}
  # The mail transport is created at startup and fails without a key, so a
  # placeholder is used until real Mailgun credentials are set.
  MAILGUN_API_KEY: {{ .Values.mailgun.apiKey | default "unset" | toString | b64enc }}
  MAILGUN_DOMAIN: {{ .Values.mailgun.domain | default "unset" | toString | b64enc }}
{{- end }}
