{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "splittytest.fullname" . }}
  labels:
    {{- include "splittytest.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_SECRET: {{ required "secrets.authSecret (or secrets.existingSecret) is required" .Values.secrets.authSecret | quote }}
  SESSION_SECRET: {{ required "secrets.sessionSecret (or secrets.existingSecret) is required" .Values.secrets.sessionSecret | quote }}
  {{- with .Values.secrets.postgresPassword }}
  POSTGRES_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.clickhousePassword }}
  CLICKHOUSE_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.mailgunApiKey }}
  MAILGUN_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.mailgunDomain }}
  MAILGUN_DOMAIN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.initUser }}
  INIT_USER: {{ . | quote }}
  {{- end }}
{{- end }}
